name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform folder (not included in the source drop)
      - name: Create Android project
        run: flutter create --platforms=android --project-name layerplay --org com.layerplay .

      # The generated template test expects a MyApp widget that this project does not use.
      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Set Android compile SDK
        run: |
          python3 - << 'PY'
          from pathlib import Path
          for p in (Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")):
              if p.exists():
                  s = p.read_text()
                  s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
                  s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
                  p.write_text(s)
          PY

      - name: Add storage and wake-lock permissions
        run: |
          python3 - << 'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = (
            '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
            '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n'
            '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
            '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    '
          )
          s = s.replace("<application", perms + "<application", 1)
          open(p, "w").write(s)
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: layerplay-apk
          path: build/app/outputs/flutter-apk/*.apk
